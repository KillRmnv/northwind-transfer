[project]
name = "transfer-core"
version = "0.1.0"
description = "Northwind Transfer — международные переводы"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "aiosqlite>=0.20,<1.0",
    "aiomysql>=0.2,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.28,<1.0",
    "aiohttp>=3.10,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-xdist>=3.6,<4.0",
    "pytest-check>=2.4,<3.0",
    "respx>=0.21,<1.0",
    "testcontainers[postgres,mysql]>=4.9,<5.0",
    "import-linter>=2.1,<3.0",
    "ruff>=0.8,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mock_provider", "scripts/chaos_run.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"mock_provider/**" = ["S105"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Слои: api -> services -> repositories -> models"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
]

[[tool.importlinter.contracts]]
name = "Справочники и ядро не зависят от слоёв"
type = "forbidden"
source_modules = ["app.models", "app.core", "app.schemas"]
forbidden_modules = ["app.api", "app.services", "app.repositories"]
